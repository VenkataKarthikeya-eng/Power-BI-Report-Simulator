global:
  environment: production
  domain: dashboardcapsule.ai

replicaCount: 3

image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/dcaps
  pullPolicy: IfNotPresent
  tag: "1.0.0"

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  tls:
    - secretName: dcaps-tls-cert
      hosts:
        - app.dashboardcapsule.ai
        - admin.dashboardcapsule.ai
        - viewer.dashboardcapsule.ai

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 75
