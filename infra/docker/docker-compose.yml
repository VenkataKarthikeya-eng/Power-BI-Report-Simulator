version: '3.8'

services:
  # Datastores
  postgres:
    image: postgres:16-alpine
    container_name: dcaps-postgres
    environment:
      POSTGRES_DB: dashboard_capsule_db
      POSTGRES_USER: dcaps_user
      POSTGRES_PASSWORD: dcaps_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: dcaps-redis
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:7.0
    container_name: dcaps-mongo
    ports:
      - "27017:27017"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: dcaps-qdrant
    ports:
      - "6333:6333"

  # Core Services
  api-gateway:
    build:
      context: ../../services/api-gateway
    container_name: dcaps-api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
    depends_on:
      - postgres
      - redis

  ai-core:
    build:
      context: ../../services/ai-core
    container_name: dcaps-ai-core
    ports:
      - "8000:8000"
    environment:
      VECTOR_DB_URL: http://qdrant:6333
    depends_on:
      - qdrant

  # Applications
  landing-web:
    build:
      context: ../..
      dockerfile: apps/landing-web/Dockerfile
    container_name: dcaps-landing-web
    ports:
      - "3000:3000"

  app-dashboard:
    build:
      context: ../..
      dockerfile: apps/app-dashboard/Dockerfile
    container_name: dcaps-app-dashboard
    ports:
      - "3001:3001"

volumes:
  postgres_data:
