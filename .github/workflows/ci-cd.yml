name: Dashboard Capsule AI — Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  unit-and-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v3
        with:
          go-version: '1.21'
      - run: go test ./...
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: cd services/ai-core && pip install -r requirements.txt && pytest

  monorepo-build-verification:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-and-integration-tests]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  docker-and-k8s-deploy:
    runs-on: ubuntu-latest
    needs: monorepo-build-verification
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Build & Push Docker Microservices
        run: |
          docker compose -f docker-compose.yml build
      - name: Deploy Helm Chart to EKS Cluster
        run: |
          echo "Deploying Dashboard Capsule AI v1.0.0 via Helm..."
